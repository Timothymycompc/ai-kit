name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # One level, not recursive. install.sh fetches the packs with
          # `submodule update --init --depth 1` and deliberately never recurses, because a
          # pack's own submodules are pinned by that pack's author and are not reviewed
          # here. Checking them out gives CI a tree no install can produce, and with
          # SOLANA_AI_KIT_LOCAL_SRC the smoke test below would copy those nested
          # third-party trees straight into its fixture project. The registry's `vendored`
          # pins are read from each pack's index, which one level provides.
          submodules: true
          # Tags, not just the tip: tests/test_update.sh reads the v2.1.0 settings.json and
          # the frozen update.sh byte range straight from the tag, so the migration baseline
          # is matched by construction instead of by a vendored copy that drifts.
          fetch-depth: 0

      - name: Validate JSON files
        run: |
          python3 -c "import json; json.load(open('.claude/settings.json'))"
          python3 -c "import json; json.load(open('.mcp.json'))"

      - name: Run validation
        run: bash validate.sh

      - name: Run test suite
        run: bash tests/run_all.sh

  # Templates are copied into user projects, so GitHub never resolves their actions;
  # check every uses: under .github/ against the API so a deleted action fails here.
  actions-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Every uses: under .github/ resolves"
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/list-actions.sh --resolve

  smoke-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Smoke test — fresh install
        run: |
          TEMP_DIR=$(mktemp -d)
          (cd "$TEMP_DIR" && git init -q)
          SOLANA_AI_KIT_LOCAL_SRC="$GITHUB_WORKSPACE" bash install.sh "$TEMP_DIR"
          test -d "$TEMP_DIR/.claude/agents"
          test -f "$TEMP_DIR/.claude/settings.json"
          python3 -c "import json; json.load(open('$TEMP_DIR/.claude/settings.json'))"
          echo "✓ Fresh install smoke test passed"

      - name: Smoke test — agents mode
        run: |
          TEMP_DIR=$(mktemp -d)
          (cd "$TEMP_DIR" && git init -q)
          SOLANA_AI_KIT_LOCAL_SRC="$GITHUB_WORKSPACE" bash install.sh --agents "$TEMP_DIR"
          test -d "$TEMP_DIR/.agents/agents"
          test ! -d "$TEMP_DIR/.claude"
          echo "✓ Agents mode smoke test passed"

  # The real clients discover the --agents install (no API key, no model calls).
  agents-mode-clients:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SOLANA_AI_KIT_LOCAL_SRC: ${{ github.workspace }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the pinned Codex and Grok Build CLIs
        run: npm install -g @openai/codex@0.156.1 @xai-official/grok@1.0.62 --no-audit --no-fund

      - name: Agents-mode installs (default, near the Codex budget, over it)
        run: |
          # big: 42 project skills, the most measured with every description whole
          # (#212). over: sendai alone registers 57 and Codex cuts 11 of them.
          # Keep the installer's own output: it reports a failed pin check, a pack that
          # would not fetch and every other refusal on stdout, so discarding it leaves a
          # failure here with nothing in the log at all (that is how #246 presented).
          for p in proj:'' big:helius,solana-mobile,light-protocol,jupiter over:sendai; do
            T="$RUNNER_TEMP/${p%%:*}"; packs="${p#*:}"
            mkdir -p "$T"; git -C "$T" init -q
            if ! bash install.sh --agents ${packs:+--with "$packs"} "$T" > "$RUNNER_TEMP/install-${p%%:*}.log" 2>&1; then
              echo "::error::the --agents install failed for ${p%%:*}"
              tail -40 "$RUNNER_TEMP/install-${p%%:*}.log"
              exit 1
            fi
          done

      # Grok Build reads the same AGENTS.md + .agents/skills/ an --agents install writes,
      # which is why one flag serves both it and Codex. `grok inspect` is a documented
      # subcommand and --json a stable shape, so assert on the JSON rather than on
      # rendered text. --trust is required: in an untrusted folder Grok reports no
      # project instructions and no project skills at all, and exits 0 doing it.
      - name: Grok Build discovers AGENTS.md and the kit skills in .agents/skills
        run: |
          cd "$RUNNER_TEMP/proj"
          # Grok skips an instruction file that .gitignore lists (skills load either
          # way), which is why an --agents install leaves AGENTS.md out of its ignore
          # block. check-ignore exits 0 for an ignored path, 1 for one that is not and
          # 128 outside a work tree, where no .gitignore applies and this would prove
          # nothing -- so only 1 passes. The install step ran `git init` here first.
          rc=0; git check-ignore -q AGENTS.md || rc=$?
          case "$rc" in
            1) ;;
            0) echo "::error::the --agents install gitignores AGENTS.md, so Grok skips it"; exit 1 ;;
            *) echo "::error::git check-ignore exited $rc: $RUNNER_TEMP/proj is not a git work tree, so the check proves nothing"; exit 1 ;;
          esac
          timeout 300 grok --trust inspect --json > "$RUNNER_TEMP/grok-proj.json"
          dump() { echo "::error::$1"; head -c 3000 "$RUNNER_TEMP/grok-proj.json"; exit 1; }
          jq -e '[.projectInstructions[] | select(.fileType == "agents_md")] | length >= 1' \
            "$RUNNER_TEMP/grok-proj.json" > /dev/null || dump "Grok did not load AGENTS.md"
          # skill-packs and token-extensions are the two the kit ships in-repo;
          # skill-packs carries the pack routing, so an --agents install can surface a
          # pack at all. ext/auditor-skill reaches the project by a different route — a
          # submodule checkout under skills/ext/ rather than install.sh's copy of the
          # in-repo skills — and is the core pack to assert on: a submodule, so a failed
          # fetch aborts the install and this cannot flake on an absent pack
          # (anthropic-skills only warns), and the one whose SKILL.md sits at its root,
          # so the path does not encode the pack's inner layout.
          for rel in skill-packs/SKILL.md token-extensions/SKILL.md ext/auditor-skill/SKILL.md; do
            jq -e --arg p "/.agents/skills/$rel" \
              '[.skills[] | select(.source.type == "project") | .source.path | select(endswith($p))] | length >= 1' \
              "$RUNNER_TEMP/grok-proj.json" > /dev/null || dump "Grok did not discover $rel"
          done
          # A floor as well as the three paths: a changed output shape would otherwise
          # pass every `jq -e` above by matching nothing at all.
          n="$(jq '[.skills[] | select(.source.type == "project")] | length' "$RUNNER_TEMP/grok-proj.json")"
          [ "${n:-0}" -ge 8 ] || dump "Grok registered $n project skills, expected at least 8"

      - name: Codex loads AGENTS.md whole
        run: |
          cd "$RUNNER_TEMP/proj"
          timeout 300 codex debug prompt-input "hello" > "$RUNNER_TEMP/codex-prompt.json"
          # Two anchors, not one: the first heading of AGENTS.md and its last. A single
          # grep near the top passes just as well on a file Codex loaded and then cut.
          for s in '# Solana project (solana-builder)' '## Project Learnings'; do
            grep -qF "$s" "$RUNNER_TEMP/codex-prompt.json" \
              || { echo "::error::Codex did not load AGENTS.md ($s missing)"; head -c 3000 "$RUNNER_TEMP/codex-prompt.json"; exit 1; }
          done

      # A name survives when Codex empties or cuts its description, so a grep for one
      # cannot see the shared budget running out (#212). Compare each description with
      # its SKILL.md instead; the over-budget install proves the check still sees a cut.
      # --require anchors the three skills to their paths under the project's own skills
      # root, which a bare grep over the prompt cannot do — every root Codex registered
      # is in there, the user's and its own bundled ones included.
      - name: Codex registers the kit skills and keeps every description whole
        run: |
          check() {
            d="$1"; min="$2"; shift 2
            ( cd "$RUNNER_TEMP/$d" && timeout 300 codex debug prompt-input "hello" > "$RUNNER_TEMP/codex-$d.json" ) || return 3
            python3 .github/scripts/codex-skill-budget.py "$@" \
              "$RUNNER_TEMP/codex-$d.json" "$RUNNER_TEMP/$d/.agents/skills" "$min"
          }
          check proj 8 --require skill-packs/SKILL.md \
                       --require token-extensions/SKILL.md \
                       --require ext/auditor-skill/SKILL.md \
            || { echo "::error::Codex did not register the kit skills, or shortened a description, in the default --agents install"; exit 1; }
          check big 40 || { echo "::error::Codex shortened a description with four Solana packs; the kit is past the skill budget"; exit 1; }
          rc=0; check over 50 || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::the budget check did not flag sendai's 57 skills (exit $rc); has Codex's output format changed?"; exit 1; }
