# safe-ai-skill project policy, deep-merged over the plugin's default policy.
# install.sh writes it, and /update refreshes it only while it is still a copy the kit
# shipped; once you edit it, it is yours and /update leaves it alone.
#
# A list replaces the default instead of merging, so the session-start skill check
# covers this project's .claude/skills and no longer sweeps your personal
# ~/.claude/skills. verify_ext_submodules stays at its default (true) on purpose:
# each ext/ pack is then checked on its own, so a finding quarantines one pack
# rather than all of ext/.
supply_chain:
  verify_skills_dirs: [".claude/skills"]

# The default denies reads of **/.env and **/.env.* at every profile. solana-ai-kit's
# firewall decides the project's dotenv files by tier instead: open at Off and Relaxed,
# writes denied at Medium, reads denied at High (its DENY_ENV_WRITE and DENY_ENV_READ).
# So the files those rules name are allowed here, and the tier rules carry the
# decision. .env.example and varlock's .env.schema carry no values. An allow glob wins
# over a deny, and this list replaces the default's, so every entry is listed. Other
# .env.* names and all key material stay denied by the default.
secrets:
  allow_read_globs: ["**/.env.example", "**/.env.schema", "**/.env", "**/.env.local", "**/.env.*.local", "**/.env.development", "**/.env.production", "**/.env.staging", "**/.env.test"]
